name: Release and Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: "library-tool/pnpm-lock.yaml"

      - name: Install dependencies from lockfile
        working-directory: ./library-tool
        run: pnpm install --frozen-lockfile

      - name: Validate package before publish
        working-directory: ./library-tool
        run: |
          node --check src/client.js
          node --check src/index.js
          node --check postinstall.js
          npm pack --dry-run

      - name: Verify version is unpublished
        working-directory: ./library-tool
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view tradux@$CURRENT_VERSION version >/dev/null 2>&1; then
            echo "Version $CURRENT_VERSION already exists on npm. Bump package.json in a reviewed PR before releasing."
            exit 1
          fi

      - name: Publish to npm
        working-directory: ./library-tool
        run: npm publish --access public

      - name: Create Git tag
        run: |
          VERSION=$(node -p "require('./library-tool/package.json').version")
          git tag "v$VERSION"
          git push origin "v$VERSION"

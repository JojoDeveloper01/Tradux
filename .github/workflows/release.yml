name: Release and Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "library-tool/src/**"
      - "library-tool/package.json"
      - "library-tool/pnpm-lock.yaml"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: "library-tool/pnpm-lock.yaml"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Verify lockfile exists
        working-directory: ./library-tool
        run: |
          if [ ! -f "pnpm-lock.yaml" ]; then
            echo "❌ pnpm-lock.yaml not found"
            exit 1
          fi
          echo "✅ pnpm-lock.yaml exists"

      - name: Install dependencies
        working-directory: ./library-tool
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: ./library-tool
        run: pnpm run test:quick

      - name: Check current version
        id: check
        working-directory: ./library-tool
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if npm view tradux@$CURRENT_VERSION version >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $CURRENT_VERSION already exists on NPM"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version $CURRENT_VERSION does not exist on NPM"
          fi

      - name: Bump patch version if current version already exists
        if: steps.check.outputs.exists == 'true'
        working-directory: ./library-tool
        run: |
          NEW_VERSION=$(pnpm version patch --no-git-tag-version)
          echo "Bumped package version to ${NEW_VERSION}"

          git add package.json pnpm-lock.yaml
          git commit -m "chore: bump tradux to ${NEW_VERSION}"
          git push origin HEAD:main

      - name: Verify package contents
        working-directory: ./library-tool
        run: npm pack --dry-run

      - name: Publish to NPM
        working-directory: ./library-tool
        run: npm publish --access public --provenance
